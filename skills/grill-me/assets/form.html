<title>{{target}}: round {{n}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- grill-me's round form, the artifact medium: doctype.md § Page and
     § Figures (in the show-me skill) are its rules. One fieldset per question
     of the round, its recommendation prefilled. The page writes nowhere: it
     builds one block the user pastes back into the chat. -->
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf7; --fg: #1d1d1f; --muted: #5b5f66; --line: #cfccc4;
    --box: #ffffff; --accent: #2458c6; --ok: #1d7a45;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181a; --fg: #ececec; --muted: #a3a7ae; --line: #45484d;
      --box: #222427; --accent: #8fb4ff; --ok: #6fd39a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181a; --fg: #ececec; --muted: #a3a7ae; --line: #45484d;
    --box: #222427; --accent: #8fb4ff; --ok: #6fd39a;
  }
  body { background: var(--bg); color: var(--fg); margin: 0;
         font: 16px/1.5 system-ui, sans-serif; padding-block: 24px; padding-inline: 16px; }
  main { max-width: 44rem; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 1rem; }
  fieldset { border: 1px solid var(--line); background: var(--box); margin: 0 0 1rem; padding: .75rem 1rem; }
  legend { font-weight: 600; padding: 0 .25rem; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; color: inherit;
             background: var(--bg); border: 1px solid var(--line); padding: .5rem; }
  .rec { color: var(--muted); font-size: .9rem; margin: .25rem 0; }
  button { font: inherit; padding: .5rem 1rem; border: 1px solid var(--accent);
           background: var(--accent); color: var(--bg); cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { color: var(--ok); margin-inline-start: .5rem; }
  #out { margin-top: 1rem; font-family: ui-monospace, monospace; font-size: 13px; }
</style>

<main>
  <h1>{{target}}: round {{n}}</h1>

  <form id="round">
    <fieldset>
      <legend>Q1: {{question title}}</legend>
      <p>{{question body}}</p>
      <p class="rec">Recommended: {{recommended answer}}</p>
      <label for="Q1">Answer</label>
      <textarea id="Q1" name="Q1" rows="3">{{recommended answer}}</textarea>
    </fieldset>

    <button type="submit">Build the answer block</button><span id="status" role="status"></span>
    <label for="out" hidden>Answer block</label>
    <textarea id="out" rows="8" readonly hidden></textarea>
  </form>
</main>

<script>
  const form = document.getElementById('round');
  const out = document.getElementById('out');
  const status = document.getElementById('status');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const lines = [...form.querySelectorAll('fieldset textarea')]
      .map((t) => `${t.name}: ${t.value.trim().replace(/\n+/g, ' / ')}`);
    out.value = lines.join('\n');
    out.hidden = false;
    out.previousElementSibling.hidden = false;
    out.select();
    try {
      await navigator.clipboard.writeText(out.value);
      status.textContent = 'Copied: paste it into the chat';
    } catch {
      status.textContent = 'Selected: copy it and paste it into the chat';
    }
  });
</script>
