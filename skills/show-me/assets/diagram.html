<title>{{type}}: {{scope}}</title>
<!-- The `diagram` template, the artifact medium: `~/.claude/shared/doctype.md` § Doctypes gives
     the parts, `doctype-page.md` and `doctype-figures.md` the rules. Replace
     every {{...}}; a part with nothing to say is removed, never left as a
     placeholder.
     Layout, the one home of these rules for every show-me SVG:
     - every coordinate, width and height divisible by 4;
     - at most 9 boxes and 12 arrows, emphasis on 2 of them; over that, an
       overview and a detail;
     - boxes grouped by how the reader thinks of the system, never by the
       folder tree;
     - arrows orthogonal, bending on r=8 elbows; a label 8 px off its line,
       on a mask of the background;
     - one arrow carries a concrete example value, a changed flow its before
       and after;
     - a key row naming what the figure left out: merged, collapsed or
       dropped;
     - a line inferred rather than read from the source is `edge inferred`,
       dashed, with its key row;
     - ids prefixed per figure, `{{slug}}-title`: inline SVGs share one id
       space. -->
<style>
  /* skin: ~/.claude/shared/doctype-skin.css, carried verbatim by every page template down to "skin end"; the probe compares */
  :root {
    color-scheme: light dark;
    --bg: #fbfaf7; --fg: #1d1d1f; --muted: #5b5f66; --line: #cfccc4;
    --box: #ffffff; --accent: #2458c6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181a; --fg: #ececec; --muted: #a3a7ae; --line: #45484d;
      --box: #222427; --accent: #8fb4ff;
    }
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #17181a; --fg: #ececec; --muted: #a3a7ae; --line: #45484d;
    --box: #222427; --accent: #8fb4ff;
  }
  body { background: var(--bg); color: var(--fg); margin: 0;
         font: 16px/1.5 system-ui, sans-serif; padding-block: 24px; padding-inline: 16px; }
  main { max-width: 48rem; margin: 0 auto; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.15rem; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg text { fill: var(--fg); font: 14px system-ui, sans-serif; }
  svg .label { fill: var(--muted); font-size: 12px; }
  /* skin end */
  h1 { margin: 0 0 1rem; }
  figure { margin: 0; overflow-x: auto; }
  svg { display: block; }
  svg .box { fill: var(--box); stroke: var(--fg); }
  svg .edge { stroke: var(--muted); fill: none; }
  svg .edge.hero { stroke: var(--fg); stroke-width: 2; }
  svg .edge.inferred { stroke-dasharray: 4 4; }
  svg .tip { fill: var(--muted); }
  svg .tip.hero { fill: var(--fg); }
  svg .mask { fill: var(--bg); }
  dl.key { display: grid; grid-template-columns: auto 1fr; gap: .25rem .75rem; margin: 1rem 0; }
  dl.key dt { font-weight: 600; }
  dl.key dd { margin: 0; }
  .read { font-size: 1.1rem; border-inline-start: 3px solid var(--fg); padding-inline-start: .75rem; }
  footer { color: var(--muted); font-size: .9rem; margin-top: 2rem; }
</style>

<main>
  <h1>{{type}}: {{scope}}</h1>

  <p class="read">{{the one thing to read off it}}</p>

  <figure tabindex="0" aria-labelledby="{{slug}}-title">
    <svg width="520" height="192" viewBox="0 0 520 192" role="img" aria-labelledby="{{slug}}-title" aria-describedby="{{slug}}-desc">
      <title id="{{slug}}-title">{{type}}: {{scope}}</title>
      <desc id="{{slug}}-desc">{{the figure in one sentence: its elements and how they connect}}</desc>
      <defs>
        <marker id="{{slug}}-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
          <path class="tip" d="M0,0 L10,5 L0,10 z"/>
        </marker>
        <marker id="{{slug}}-arrow-hero" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
          <path class="tip hero" d="M0,0 L10,5 L0,10 z"/>
        </marker>
      </defs>
      <rect class="box" x="8" y="16" width="160" height="64" rx="8"/>
      <text x="88" y="44" text-anchor="middle">{{element A}}</text>
      <text class="label" x="88" y="64" text-anchor="middle">{{level, technology}}</text>
      <rect class="box" x="352" y="112" width="160" height="64" rx="8"/>
      <text x="432" y="140" text-anchor="middle">{{element B}}</text>
      <text class="label" x="432" y="160" text-anchor="middle">{{level, technology}}</text>
      <path class="edge hero" d="M168,48 H252 Q260,48 260,56 V136 Q260,144 268,144 H348" marker-end="url(#{{slug}}-arrow-hero)"/>
      <rect class="mask" x="264" y="72" width="136" height="32"/>
      <text class="label" x="268" y="84">{{intent, protocol}}</text>
      <text class="label" x="268" y="100">{{example value}}</text>
    </svg>
    <figcaption>
      <dl class="key">
        <dt>box</dt><dd>{{what a box is}}</dd>
        <dt>arrow</dt><dd>{{what a line means, read in its direction}}</dd>
        <dt>dashed</dt><dd>{{a line inferred, not read from the source}}</dd>
        <dt>not drawn</dt><dd>{{what was merged, collapsed or dropped}}</dd>
      </dl>
    </figcaption>
  </figure>

  <footer>Source: <a href="{{url}}">{{path}}</a> at <code>{{sha}}</code></footer>
</main>
