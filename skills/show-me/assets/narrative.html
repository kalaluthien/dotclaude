<title>{{subject}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The `narrative` template, the artifact medium: doctype.md § Doctypes gives
     the parts, § Page and § Figures the rules. Replace every {{...}}; repeat a
     chapter per question; a part with nothing to say is removed. The new,
     changed and gone classes are for a PR and carry nothing else. -->
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf7; --fg: #1d1d1f; --muted: #5b5f66; --line: #cfccc4;
    --box: #ffffff; --accent: #2458c6;
    --new: #1d7a45; --changed: #9a5b00; --gone: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181a; --fg: #ececec; --muted: #a3a7ae; --line: #45484d;
      --box: #222427; --accent: #8fb4ff;
      --new: #6fd39a; --changed: #e7ad55; --gone: #f28b82;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181a; --fg: #ececec; --muted: #a3a7ae; --line: #45484d;
    --box: #222427; --accent: #8fb4ff;
    --new: #6fd39a; --changed: #e7ad55; --gone: #f28b82;
  }
  body { background: var(--bg); color: var(--fg); margin: 0;
         font: 16px/1.55 system-ui, sans-serif; padding-block: 24px; padding-inline: 16px; }
  main { max-width: 48rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  .thesis { font-size: 1.15rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1.15rem; margin: 2rem 0 .5rem; }
  figure { margin: 0; overflow-x: auto; }
  svg { display: block; max-width: 100%; height: auto; }
  svg .box { fill: var(--box); stroke: var(--fg); }
  svg text { fill: var(--fg); font: 13px system-ui, sans-serif; }
  svg .new { stroke: var(--new); stroke-width: 2; }
  svg .changed { stroke: var(--changed); stroke-width: 2; }
  svg .gone { stroke: var(--gone); stroke-dasharray: 4 3; }
  nav ol { padding-inline-start: 1.25rem; }
  pre { overflow-x: auto; background: var(--box); border: 1px solid var(--line);
        padding: .75rem; font: 13px/1.45 ui-monospace, monospace; }
  details { margin-top: .5rem; }
  .key { color: var(--muted); font-size: .9rem; }
  .absent { color: var(--muted); }
  footer { color: var(--muted); font-size: .9rem; margin-top: 2rem; }
  a { color: var(--accent); }
  a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

<main>
  <header>
    <h1>{{subject}}</h1>
    <p class="thesis">{{one line: what it is and why it exists}}</p>
  </header>

  <section aria-labelledby="map">
    <h2 id="map">Map</h2>
    <figure>
      <svg viewBox="0 0 560 120" role="img" aria-label="{{map of the whole}}">
        <rect class="box" x="10" y="30" width="160" height="56" rx="6"/>
        <text x="90" y="63" text-anchor="middle">{{part 1}}</text>
        <rect class="box changed" x="200" y="30" width="160" height="56" rx="6"/>
        <text x="280" y="63" text-anchor="middle">{{part 2}}</text>
        <rect class="box new" x="390" y="30" width="160" height="56" rx="6"/>
        <text x="470" y="63" text-anchor="middle">{{part 3}}</text>
      </svg>
      <figcaption class="key">{{key: box = ..., for a PR: green new, amber changed, dashed red gone}}</figcaption>
    </figure>
    <nav aria-label="Chapters">
      <ol>
        <li><a href="#ch1">{{question 1}}</a></li>
      </ol>
    </nav>
  </section>

  <section aria-labelledby="ch1">
    <h2 id="ch1">{{question 1}}</h2>
    <p>{{the answer, in plain words}}</p>
    <details>
      <summary>Evidence: <code>{{path:line}}</code></summary>
      <pre><code>{{code slice or diff}}</code></pre>
    </details>
  </section>

  <section aria-labelledby="absent">
    <h2 id="absent">Not stated in the source</h2>
    <p class="absent">{{a reason the source omits, named as absent}}</p>
  </section>

  <footer>Source: <a href="{{url}}">{{repository or PR}}</a> at <code>{{sha}}</code></footer>
</main>
