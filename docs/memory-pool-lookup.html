<h1>Memory pool lookup</h1>
<p>A session's pool is named by its working directory, unless its environment
names another, and only the pool's <code>MEMORY.md</code> is loaded unasked.</p>

<figure>
<div class="scroll">
<svg viewBox="0 0 640 500" role="img" aria-labelledby="t d">
  <title id="t">Flow diagram: how one Claude Code session on this machine finds its memory pool</title>
  <desc id="d">Session start reads the environment. If CLAUDE_COWORK_MEMORY_PATH_OVERRIDE is set, which the Remote Control bridge sets for a child session, that path names the pool. If not, the key is the working directory with every character that is not a letter or digit written as a hyphen, and it names ~/.claude/projects/key/memory/. The harness injects that pool's MEMORY.md on the first user turn; a memory file is read only when the session follows its index line.</desc>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <text class="ttl" x="10" y="22">Flow diagram · one session's memory-pool lookup, this machine</text>

  <!-- step: session start -->
  <rect class="box" x="230" y="44" width="180" height="40" rx="12"/>
  <text x="320" y="69" text-anchor="middle">Session starts</text>

  <!-- test -->
  <polygon class="box" points="320,122 440,162 320,202 200,162"/>
  <text x="320" y="158" text-anchor="middle">memory path override</text>
  <text x="320" y="174" text-anchor="middle">in the environment?</text>

  <!-- outside partner -->
  <rect class="box out" x="480" y="138" width="150" height="48"/>
  <text x="555" y="158" text-anchor="middle">Remote Control</text>
  <text x="555" y="175" text-anchor="middle">bridge</text>

  <!-- step: override -->
  <rect class="box" x="20" y="238" width="190" height="48" rx="12"/>
  <text x="115" y="258" text-anchor="middle">take the override</text>
  <text x="115" y="275" text-anchor="middle">path as the pool</text>

  <!-- step: key -->
  <rect class="box" x="240" y="238" width="380" height="62" rx="12"/>
  <text x="430" y="258" text-anchor="middle">key = cwd, each non-letter-or-digit → "-"</text>
  <text class="lbl" x="430" y="275" text-anchor="middle">/Users/hyungmokim/.claude</text>
  <text class="lbl" x="430" y="291" text-anchor="middle">→ -Users-hyungmokim--claude</text>

  <!-- on disk: pool -->
  <rect class="box" x="170" y="350" width="300" height="48"/>
  <text x="320" y="369" text-anchor="middle">the pool, a memory/ directory</text>
  <text class="lbl" x="320" y="387" text-anchor="middle">keyed: ~/.claude/projects/&lt;key&gt;/memory/</text>

  <!-- on disk: files -->
  <rect class="box" x="60" y="446" width="200" height="40"/>
  <text x="160" y="471" text-anchor="middle">MEMORY.md</text>
  <rect class="box" x="390" y="446" width="200" height="40"/>
  <text x="490" y="471" text-anchor="middle">a memory file</text>

  <!-- edges -->
  <path class="edge" d="M320,84 V120" marker-end="url(#head)"/>
  <text class="lbl" x="328" y="106">reads env</text>

  <path class="edge" d="M480,162 H443" marker-end="url(#head)"/>
  <text class="lbl" x="484" y="204">sets it, for a child</text>
  <text class="lbl" x="484" y="218">session it launches</text>

  <path class="edge" d="M200,162 H115 V236" marker-end="url(#head)"/>
  <text class="lbl" x="124" y="154">yes</text>

  <path class="edge" d="M320,202 V236" marker-end="url(#head)"/>
  <text class="lbl" x="328" y="224">no: encode, one-way</text>

  <path class="edge" d="M115,286 V330 H250 V348" marker-end="url(#head)"/>
  <text class="lbl" x="124" y="322">names</text>

  <path class="edge" d="M430,300 V330 H390 V348" marker-end="url(#head)"/>
  <text class="lbl" x="438" y="326">names</text>

  <path class="edge" d="M250,398 V420 H160 V444" marker-end="url(#head)"/>
  <text class="lbl" x="40" y="414">harness injects it,</text>
  <text class="lbl" x="40" y="428">first user turn</text>

  <path class="edge" d="M260,476 H388" marker-end="url(#head)"/>
  <text class="lbl" x="268" y="454">session reads it,</text>
  <text class="lbl" x="268" y="468">via its index line</text>

  <!-- key -->
  <g transform="translate(470,34)">
    <rect class="box" x="0" y="0" width="22" height="14" rx="5"/>
    <text class="lbl" x="30" y="12">step</text>
    <polygon class="box" points="11,22 22,29 11,36 0,29"/>
    <text class="lbl" x="30" y="34">test</text>
    <rect class="box" x="0" y="44" width="22" height="14"/>
    <text class="lbl" x="30" y="56">on disk</text>
    <rect class="box out" x="0" y="66" width="22" height="14"/>
    <text class="lbl" x="30" y="78">outside the session</text>
  </g>
</svg>
</div>
<figcaption>Derive the key from the path, never the path from the key: two paths can
share one key. No memory file is injected; the index line is the only thing
that causes a read.</figcaption>
</figure>
